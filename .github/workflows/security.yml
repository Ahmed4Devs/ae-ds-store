name: Security and integrity

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ae_ds_store_test
          POSTGRES_USER: ae_store_test
          POSTGRES_PASSWORD: local-ci-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ae_store_test -d ae_ds_store_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ae_store_test:local-ci-password-not-for-production@localhost:5432/ae_ds_store_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://ae_store_test:local-ci-password-not-for-production@localhost:5432/ae_ds_store_test?schema=public
      BETTER_AUTH_SECRET: ci-only-random-looking-secret-000000000000000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      STORE_PUBLIC_URL: http://localhost:3000
      AE_MODE: mock
      PAYMENT_PROVIDER: manual
      MAIL_PROVIDER: console
      VERIFY_QUERY_CONFIRM: "query-test:localhost:5432:ae_ds_store_test"

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Apply migrations to an isolated database
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run integration and security checks
        run: npm run verify
        env:
          NODE_ENV: test
          AUTH_VERIFY_TEST_DB: "true"

      - name: Run HTTP boundary checks against Next.js
        run: npm run verify:query:isolated

      - name: Production build
        run: npm run build
