<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="متجر الوصل — تسوّق عالمي بأسعار الجملة">
  <title>متجر الوصل</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- دوائر باهتة تكسر الفراغ بلا صور خارجية تُحمَّل مع البطاقة -->
  <circle cx="1080" cy="120" r="220" fill="#10b981" opacity="0.14"/>
  <circle cx="140" cy="580" r="180" fill="#10b981" opacity="0.10"/>

  <rect x="944" y="96" width="120" height="120" rx="30" fill="#ffffff"/>
  <g fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="994" cy="139" r="19"/>
    <path d="M1013 144c5.5 22 3 36.5-24 42.5"/>
  </g>

  <text x="1064" y="330" text-anchor="end" font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" font-size="84" font-weight="700" fill="#ffffff">متجر الوصل</text>
  <text x="1064" y="404" text-anchor="end" font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" font-size="40" font-weight="400" fill="#a7f3d0">تسوّق عالمي بأسعار الجملة</text>
  <text x="1064" y="492" text-anchor="end" font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" font-size="30" font-weight="400" fill="#6ee7b7">أسعار بالريال شاملة الضريبة · شحن إلى جميع مناطق المملكة</text>
</svg>
