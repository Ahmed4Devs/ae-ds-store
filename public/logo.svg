<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" role="img" aria-label="متجر الوصل">
  <title>متجر الوصل</title>
  <!-- الشعار مرسوم بمسارات لا بخط نصّي في العلامة: حرف الواو هنا شكل
       هندسي مستقل، فلا يتغيّر بتغيّر خطوط الجهاز ولا يحتاج تحميل خط. -->
  <rect x="164" y="4" width="48" height="48" rx="13" fill="#059669"/>
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="184" cy="21" r="7.5"/>
    <path d="M191.5 23c2.2 8.8 1.2 14.6-9.5 17"/>
  </g>
  <!-- الاسم نصّ عادي بخطوط النظام: يبقى قابلًا للقراءة والنسخ، وإن غاب
       خط عربي أنيق فالعلامة نفسها (المربّع) تحمل الهوية. -->
  <text x="150" y="37" text-anchor="end" font-family="'Segoe UI', 'Noto Naskh Arabic', system-ui, sans-serif" font-size="27" font-weight="700" fill="#059669">متجر الوصل</text>
</svg>
